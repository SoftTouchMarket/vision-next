name: Build Vision Next APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source archive
        run: unzip -q VisionNext-GitHub-Actions.zip

        
      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("vision-next/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {"""
          )

          p.write_text(s)
          PY

      - name: Fix back navigation API

        run: |

          python3 - <<'PY'

          from pathlib import Path

          p = Path("vision-next/app/src/main/java/com/visionnext/launcher/MainActivity.kt")

          s = p.read_text()

          old = "onBackPressedDispatcher.onBackPressed()"

          new = "onBackPressed()"

          if old not in s:

              raise SystemExit("Expected back-navigation code was not found")

          p.write_text(s.replace(old, new))

          print("Back-navigation compatibility fix applied")

          PY
          
      - name: Build debug APK
        run: gradle --no-daemon -p vision-next assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-next-debug-apk
          path: vision-next/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
